name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_os:
        description: Also run on Windows and macOS
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux only on push and PR while the repo is private (Windows and macOS runners use paid
        # minutes several times faster). Run the workflow by hand for all three; macos-latest is
        # Apple silicon (M-series).
        os: ${{ fromJSON(inputs.all_os && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
